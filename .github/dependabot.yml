version: 2
updates:
  # Gradle dependencies (build scripts + version catalog libs.versions.toml)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Helidon 27+ follows the JDK tip-and-tail cadence and needs Java 27; this library
      # targets the Java 25 toolchain and stays on the Helidon 4 LTS line.
      - dependency-name: "io.helidon*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows (kept pinned to SHAs; Dependabot bumps them)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
