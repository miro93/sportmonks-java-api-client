# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME   — Central Portal user token username
#   MAVEN_CENTRAL_PASSWORD   — Central Portal user token password
#   SIGNING_KEY              — ASCII-armored GPG private key (gpg --export-secret-keys --armor <id>)
#   SIGNING_KEY_PASSWORD     — Passphrase for the GPG key above

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # upload the SBOMs to the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Publish to Maven Central and generate the CycloneDX SBOMs
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./gradlew publishToMavenCentral cyclonedxDirectBom --no-daemon -PVERSION_NAME="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Attach the SBOMs to the GitHub Release
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for module in core football motorsport; do
            cp "$module/build/reports/cyclonedx-direct/bom.json" "sportmonks-$module-$VERSION-cyclonedx.json"
          done
          gh release upload "$GITHUB_REF_NAME" ./*-cyclonedx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
