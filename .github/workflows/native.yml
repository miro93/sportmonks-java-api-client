name: Native

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build native smoke image
        run: ./gradlew :native-smoke:nativeCompile --no-daemon

      - name: Run native smoke binary
        run: ./native-smoke/build/native/nativeCompile/native-smoke
