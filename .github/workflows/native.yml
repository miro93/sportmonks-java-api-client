name: Native

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM 27
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '27'
          distribution: graalvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build native smoke image
        run: ./gradlew :native-smoke:nativeCompile --no-daemon

      - name: Run native smoke binary
        run: ./native-smoke/build/native/nativeCompile/native-smoke
